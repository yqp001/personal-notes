{% extends "base.html" %}
{% block title %}登录 · 个人笔记{% endblock %}
{% block content %}
<section class="page-narrow">
  <div class="auth-card">
    <h1>登录账号</h1>
    <form id="login-form" data-auth-mode="login" novalidate>
      <label for="email">邮箱</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="form-error" id="form-error" data-error hidden></p>
      <button type="submit" class="btn btn-primary">登录</button>
      <p class="auth-alt">还没有账号？<a href="/register">去注册</a></p>
    </form>
  </div>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/auth.js') }}"></script>{% endblock %}
