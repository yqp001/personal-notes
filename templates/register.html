{% extends "base.html" %}
{% block title %}注册 · 个人笔记{% endblock %}
{% block content %}
<section class="page-narrow">
  <div class="auth-card">
    <h1>注册新账号</h1>
    <form id="register-form" data-auth-mode="register" novalidate>
      <label for="email">邮箱</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="nickname" required>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required>
      <label for="confirm_password">确认密码</label>
      <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
      <p class="form-error" id="form-error" data-error hidden></p>
      <button type="submit" class="btn btn-primary">注册</button>
      <p class="auth-alt">已有账号？<a href="/login">去登录</a></p>
    </form>
  </div>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/auth.js') }}"></script>{% endblock %}
